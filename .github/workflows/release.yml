name: release

# Pushing a v* tag publishes a release. The tag must be a semver version
# (v0.0.1, v0.0.1-alpha.3) and point at a commit on main; a tag ruleset limits
# who can push tags. Nothing else triggers this workflow.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      zig: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag is a version on main
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} is not a version like v0.0.1 or v0.0.1-alpha.1"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main"
            exit 1
          fi

      - name: Check .zigversion is on the 0.17 release line
        id: pin
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .zigversion)"
          if ! [[ "$version" =~ ^0\.17\.[0-9]+$ ]]; then
            echo "::error file=.zigversion::.zigversion is '${version}', expected 0.17.x"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: No pull_request_target workflows
        run: |
          if grep -rnE '^[[:space:]]*(-[[:space:]]*)?pull_request_target[[:space:]]*(:|$)|^on:.*pull_request_target' .github/workflows; then
            echo "::error::workflows must not use pull_request_target"
            exit 1
          fi

      - name: No path dependencies in build.zig.zon
        run: |
          if grep -nE '\.path *=' build.zig.zon; then
            echo "::error file=build.zig.zon::path dependencies must not be committed"
            exit 1
          fi

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.pin.outputs.version }}

      - name: zig fmt --check
        run: zig fmt --check .

      - name: zig build test
        run: zig build test --summary all

  build:
    needs: check
    strategy:
      matrix:
        include:
          # musl: one static binary that runs on any Linux distribution.
          - os: ubuntu-latest
            target: x86_64-linux-musl
            asset: venomx-x86_64-linux
          # Apple Silicon, built natively so the smoke test runs on macOS.
          - os: macos-15
            target: aarch64-macos
            asset: venomx-aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ needs.check.outputs.zig }}

      - name: Build venomx
        run: zig build -Doptimize=ReleaseFast -Dstrip=true -Dtarget=${{ matrix.target }} --summary all

      - name: Smoke test
        run: test/release_smoke.sh zig-out/bin/venomx

      - name: Package
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p "dist/${ASSET}"
          cp zig-out/bin/venomx LICENSE README.md "dist/${ASSET}/"
          tar -C dist -czf "dist/${ASSET}.tar.gz" "${ASSET}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: venomx-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          for asset in venomx-x86_64-linux.tar.gz venomx-aarch64-macos.tar.gz; do
            test -f "$asset" || { echo "::error::missing $asset"; exit 1; }
          done
          sha256sum venomx-*.tar.gz > sha256sums.txt

      # Asset names carry no version, so releases/latest/download/<asset>
      # serves whichever release is marked latest. A pre-release tag (one with
      # a '-', like v0.0.2-alpha.1) is marked latest only while there is no
      # stable release yet; after that it is published as a pre-release and
      # latest stays on the newest stable release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          kind=(--latest)
          if [[ "$TAG" == *-* ]]; then
            stable="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts \
              --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')"
            if [ -n "$stable" ]; then
              kind=(--prerelease --latest=false)
            fi
          fi
          echo "publishing ${TAG} with ${kind[*]}"
          gh release create "$TAG" dist/*.tar.gz dist/sha256sums.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag "${kind[@]}" \
            --title "venomx $TAG" --generate-notes
