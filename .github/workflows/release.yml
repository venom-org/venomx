name: release

# Pushing a tag publishes a release. The tag must point at a commit on main;
# a tag ruleset limits who can push tags. Nothing else triggers this workflow.
on:
  push:
    tags: ['**']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      zig: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag points at a commit on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main"
            exit 1
          fi

      - name: Check .zigversion is on the 0.17 release line
        id: pin
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .zigversion)"
          if ! [[ "$version" =~ ^0\.17\.[0-9]+$ ]]; then
            echo "::error file=.zigversion::.zigversion is '${version}', expected 0.17.x"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: No pull_request_target workflows
        run: |
          if grep -rnE '^[[:space:]]*(-[[:space:]]*)?pull_request_target[[:space:]]*(:|$)|^on:.*pull_request_target' .github/workflows; then
            echo "::error::workflows must not use pull_request_target"
            exit 1
          fi

      - name: No path dependencies in build.zig.zon
        run: |
          if grep -nE '\.path *=' build.zig.zon; then
            echo "::error file=build.zig.zon::path dependencies must not be committed"
            exit 1
          fi

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.pin.outputs.version }}

      - name: zig fmt --check
        run: zig fmt --check .

      - name: zig build test
        run: zig build test --summary all

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ needs.check.outputs.zig }}

      # musl: one static binary that runs on any Linux distribution.
      - name: Build venomx
        run: zig build -Doptimize=ReleaseFast -Dstrip=true -Dtarget=x86_64-linux-musl --summary all

      - name: Package
        run: |
          set -euo pipefail
          name="venomx-x86_64-linux"
          mkdir -p "dist/${name}"
          cp zig-out/bin/venomx LICENSE README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: venomx-x86_64-linux
          path: dist/venomx-x86_64-linux.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: venomx-x86_64-linux
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum venomx-*.tar.gz > sha256sums.txt

      # Asset names carry no version, so releases/latest/download/<asset>
      # always points at the newest release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/sha256sums.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "venomx $TAG" --generate-notes
